apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-broken-app
  labels:
    app: node-broken-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-broken-app
  template:
    metadata:
      labels:
        app: node-broken-app
    spec:
      containers:
        - name: web
          image: node-secure-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            # INTENTIONAL ERROR: The Node.js application inside the image listens on port 3000,
            # but we configure the containerPort here as 8080.
            - containerPort: 8080
              name: http
          env:
            - name: APP_VERSION
              value: "1.0.0-broken"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # INTENTIONAL ERROR: Because the containerPort is misconfigured and the service
          # is not actually listening on port 8080, the readiness probe will fail.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
