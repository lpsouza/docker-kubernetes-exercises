apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-secure-app
  labels:
    app: node-secure-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-secure-app
  template:
    metadata:
      labels:
        app: node-secure-app
    spec:
      containers:
        - name: web
          # Use node-secure-app:1.0.0 if loaded locally, or
          # localhost:5001/node-secure-app:1.0.0 if using the local registry setup
          image: node-secure-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: APP_VERSION
              value: "1.0.0"
          # Resource requests and limits to prevent noisy neighbor issue in shared clusters
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Liveness probe to determine if the container needs to be restarted
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness probe to check if the container is ready to accept traffic
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
